const cards=document.getElementById('cards');
function renderCards(list=characters){cards.innerHTML='';if(!list.length){cards.innerHTML='<p style="color:#a99bbd;text-align:center;grid-column:1/-1">Ничего не найдено</p>';return}list.forEach(c=>{const el=document.createElement('article');el.className='character '+(c.id==='maxim'?'maxim':(c.theme||''));el.innerHTML=`<h2>${c.name}</h2><p>${c.short}</p><span class="tag">ОТКРЫТЬ ДОСЬЕ</span>`;el.addEventListener('click',()=>showCharacter(c.id));cards.appendChild(el)})}
function showCharacter(id){const c=characters.find(x=>x.id===id);if(!c)return;const box=document.getElementById('detailBox');box.classList.toggle('detail-maxim',id==='maxim');let stats=c.stats.map(([label,value,custom])=>{let width=Math.max(0,Math.min(100,Number(value)));let shown=custom||value;return `<div class="stat"><div class="stat-head"><span>${label}</span><b>${shown}</b></div><div class="bar"><div class="fill" style="width:${width}%"></div></div></div>`}).join('');document.getElementById('detailContent').innerHTML=`<h2>${c.name}</h2><p class="detail-desc">${c.desc}</p><h3 style="color:#cba4ee;font-size:13px;letter-spacing:2px">ХАРАКТЕРИСТИКИ</h3>${stats}`;document.getElementById('details').style.display='flex'}
document.getElementById('close').onclick=()=>document.getElementById('details').style.display='none';document.getElementById('details').addEventListener('click',e=>{if(e.target.id==='details')e.currentTarget.style.display='none'});document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('details').style.display='none'});
document.getElementById('search').addEventListener('input',e=>{let q=e.target.value.toLowerCase().trim();renderCards(characters.filter(c=>(c.name+' '+c.short+' '+c.desc).toLowerCase().includes(q)))});renderCards();
// Перетаскивание панели состава мышью и пальцем
const panel=document.getElementById('persons'),handle=document.getElementById('drag');let dragging=false,dx=0,dy=0;handle.addEventListener('pointerdown',e=>{dragging=true;const r=panel.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top;handle.setPointerCapture(e.pointerId)});handle.addEventListener('pointermove',e=>{if(!dragging)return;panel.style.left=Math.max(0,Math.min(innerWidth-panel.offsetWidth,e.clientX-dx))+'px';panel.style.top=Math.max(0,Math.min(innerHeight-panel.offsetHeight,e.clientY-dy))+'px';panel.style.right='auto'});handle.addEventListener('pointerup',()=>dragging=false);handle.addEventListener('pointercancel',()=>dragging=false);
// Фоновые звёзды и кометы
const pc=document.getElementById('particles'),pctx=pc.getContext('2d'),cc=document.getElementById('comets'),cctx=cc.getContext('2d');let stars=[],comets=[];function resize(){pc.width=cc.width=innerWidth;pc.height=cc.height=innerHeight;stars=Array.from({length:65},()=>({x:Math.random()*pc.width,y:Math.random()*pc.height,r:Math.random()*1.6+.3,a:Math.random(),s:Math.random()*.012+.003}));comets=Array.from({length:7},()=>({x:Math.random()*cc.width,y:Math.random()*cc.height,v:Math.random()*3+2,len:Math.random()*75+45}))}addEventListener('resize',resize);resize();function animate(){pctx.clearRect(0,0,pc.width,pc.height);stars.forEach(s=>{s.a+=s.s;if(s.a>1||s.a<0)s.s*=-1;pctx.beginPath();pctx.arc(s.x,s.y,s.r,0,Math.PI*2);pctx.fillStyle=`rgba(220,195,255,${Math.max(.15,s.a)})`;pctx.fill()});cctx.clearRect(0,0,cc.width,cc.height);comets.forEach(c=>{c.x+=c.v;c.y+=c.v*.35;let g=cctx.createLinearGradient(c.x-c.len,c.y-c.len*.35,c.x,c.y);g.addColorStop(0,'rgba(70,130,255,0)');g.addColorStop(1,'rgba(135,190,255,.8)');cctx.strokeStyle=g;cctx.lineWidth=2;cctx.beginPath();cctx.moveTo(c.x-c.len,c.y-c.len*.35);cctx.lineTo(c.x,c.y);cctx.stroke();if(c.x>cc.width+100||c.y>cc.height+100){c.x=-Math.random()*300;c.y=Math.random()*cc.height*.7}});requestAnimationFrame(animate)}animate();
</script></body></html>
