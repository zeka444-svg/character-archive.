<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LULU ARCHIVE</title>

<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#050509;color:#f5f1ff;font-family:Arial,sans-serif;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;width:420px;height:420px;border-radius:50%;filter:blur(110px);opacity:.2;pointer-events:none;z-index:0}
body:before{background:#7826ff;top:-170px;left:-140px}
body:after{background:#073bff;right:-180px;bottom:-190px}

#particles,#comets{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#particles{z-index:0}
#comets{z-index:1}

main{position:relative;z-index:2;max-width:1100px;margin:auto;padding:38px 20px 24px}
header{text-align:center;margin:10px 0 34px}
h1{font-size:clamp(34px,7vw,58px);letter-spacing:5px;margin:0;text-shadow:0 0 12px #9b55ff,0 0 34px #7025ff}
.subtitle{color:#a99bbd;letter-spacing:3px;font-size:11px;margin-top:10px}

.search-wrap{max-width:520px;margin:0 auto 28px}
.search{width:100%;padding:15px 18px;border-radius:14px;border:1px solid #56317c;background:#100d19;color:white;font-size:15px;outline:none}
.search:focus{border-color:#b06aff;box-shadow:0 0 20px #8a35ff55}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.character{position:relative;min-height:245px;padding:22px;border:1px solid #59318a;border-radius:19px;background:linear-gradient(145deg,#171020,#09080f 75%);overflow:hidden;cursor:pointer;transition:.25s;box-shadow:0 8px 30px #0008}
.character:hover{transform:translateY(-6px);box-shadow:0 10px 35px #802cff44}
.character h2{position:relative;z-index:2;font-size:19px;line-height:1.3;margin:0 0 13px;text-shadow:0 2px 8px #000}
.character p{position:relative;z-index:2;color:#d1c7df;line-height:1.5;font-size:14px;margin:0 0 20px}
.tag{position:relative;z-index:2;display:inline-block;padding:7px 10px;border-radius:20px;background:#6b2bb833;border:1px solid #a45bdb;color:#e6caff;font-size:10px;letter-spacing:1px}

/* Максим — красно-чёрный стиль */
.character.maxim{
border:1px solid #c33a50;
background:linear-gradient(145deg,#350b16,#10070c 75%);
box-shadow:0 0 20px #c3224433;
}
.character.maxim:before{
content:"🦾";
position:absolute;
right:15px;
top:30px;
font-size:85px;
opacity:.22;
filter:drop-shadow(0 0 15px red);
}
.character.maxim h2{color:#ff8295;text-shadow:0 0 12px #ff244c}
.character.maxim .tag{border-color:#e34a62;color:#ffc1cb;background:#68132666}

/* Надя — алмазы */
.character.nadya{border:1px solid #42d9ff;background:linear-gradient(145deg,#092c48,#07101e);box-shadow:0 0 18px #16cfff33}
.character.nadya:before{content:"💎";position:absolute;right:12px;top:20px;font-size:85px;opacity:.25;filter:drop-shadow(0 0 15px #5ce5ff)}
.character.nadya:after{content:"💎 ✧ 💎";position:absolute;right:12px;bottom:12px;font-size:22px;letter-spacing:8px;color:#8cecff;opacity:.7}
.character.nadya h2{color:#8feaff;text-shadow:0 0 12px #00cfff}
.character.nadya .tag{border-color:#31c9ef;color:#b9f5ff;background:#12628a66}

/* Оля — золото */
.character.olya{border:1px solid #e6b82f;background:linear-gradient(145deg,#49330b,#171006);box-shadow:0 0 20px #e8b72f44}
.character.olya:before{content:"👑";position:absolute;right:12px;top:15px;font-size:80px;opacity:.3;filter:drop-shadow(0 0 15px gold)}
.character.olya:after{content:"✦ ✨ ✦";position:absolute;right:15px;bottom:13px;font-size:24px;color:#ffd84d;opacity:.8}
.character.olya h2{color:#ffdf72;text-shadow:0 0 12px #ffb700}
.character.olya .tag{border-color:#e6bd40;color:#ffe89a;background:#9b6b1c55}

/* Состав архива */
.main-persons{position:fixed;z-index:5;top:15px;right:15px;width:145px;padding:10px;border:1px solid #7440a5;border-radius:13px;background:#100b19ed;box-shadow:0 0 20px #7e31bb44;backdrop-filter:blur(8px);font-size:11px}
.persons-drag{font-weight:bold;color:#d9b5ff;text-align:center;padding:4px 2px 9px;margin-bottom:7px;border-bottom:1px solid #56336d;cursor:move;touch-action:none;user-select:none}
.persons-list{line-height:1.65;color:#d7cce4}
.persons-list b{color:white}

/* Окно досье */
#details{display:none;position:fixed;inset:0;z-index:10;background:#000b;backdrop-filter:blur(7px);padding:18px;overflow:auto;align-items:center;justify-content:center}
.detail-box{position:relative;width:min(600px,100%);max-height:90vh;overflow:auto;padding:27px;border:1px solid #8d4bc1;border-radius:20px;background:linear-gradient(145deg,#1a1025,#09080f);box-shadow:0 0 45px #7929bd55}
.detail-box h2{margin:0 40px 13px 0;color:#e7c7ff}
.detail-desc{color:#d0c4dc;line-height:1.6}
.close{position:absolute;right:15px;top:13px;border:1px solid #75429a;border-radius:10px;background:#25152f;color:white;padding:8px 12px;font-size:18px;cursor:pointer}
.stat{margin:17px 0}
.stat-head{display:flex;justify-content:space-between;gap:12px;font-size:13px;margin-bottom:7px;color:#e6d8f0}
.bar{height:9px;border-radius:20px;background:#30243b;overflow:hidden}
.fill{height:100%;border-radius:20px;background:linear-gradient(90deg,#7627bd,#d58cff);box-shadow:0 0 12px #a84cff}
.detail-maxim{border-color:#c33a50}
.detail-maxim .fill{background:linear-gradient(90deg,#8b142d,#ff657b)}
.detail-nadya{border-color:#42d9ff}
.detail-nadya .fill{background:linear-gradient(90deg,#008dce,#8cecff)}
.detail-olya{border-color:#e6b82f}
.detail-olya .fill{background:linear-gradient(90deg,#b47b08,#ffe36a)}

footer{text-align:center;color:#6f627d;font-size:11px;letter-spacing:2px;padding:38px 0 12px}

@media(max-width:600px){
main{padding:85px 14px 20px}
.main-persons{top:10px;right:10px;width:135px}
.cards{grid-template-columns:1fr}
.character{min-height:205px}
}
</style>
</head>

<body>

<canvas id="particles"></canvas>
<canvas id="comets"></canvas>

<div class="main-persons" id="persons">
<div class="persons-drag" id="drag">✥ СОСТАВ АРХИВА</div>
<div class="persons-list">
<b>ШАВКА</b> • Соня<br>
<b>ЧУРКА</b> • Кира<br>
<b>БОРЦЫ</b> • Максим, Женя<br>
<b>БЫВШИЕ БОРЦЫ</b> • Соус
</div>
</div>

<main>
<header>
<h1>LULU ARCHIVE</h1>
<div class="subtitle">СЕКРЕТНЫЙ АРХИВ ОБЪЕКТОВ</div>
</header>

<div class="search-wrap">
<input class="search" id="search" placeholder="Поиск персонажа..." autocomplete="off">
</div>

<section class="cards" id="cards"></section>
<footer>LULU ARCHIVE • VERSION 3.2</footer>
</main>

<div id="details">
<div class="detail-box" id="detailBox">
<button class="close" id="close">✕</button>
<div id="detailContent"></div>
</div>
</div>

<script>
const characters=[
{
id:'sonya',
name:'👹 СОНЯ — ТЯЖЁЛЫЙ ТАНК',
short:'Самый опасный объект архива.',
desc:'Самый опасный объект как задавит масой ахуеть можно а так норм.',
stats:[['Опасность',10],['Танк',200],['Сила подрочить',1000],['Страх',100],['Скорость',3]]
},
{
id:'kira',
name:'🦊 КИРА — БЫСТРЫЙ ОБЪЕКТ',
short:'Очень быстрая и ловкая.',
desc:'Очень быстрая. Умеет дрочить со скоростью звука и неожиданно появляться.',
stats:[['Опасность',7],['Скорость',95],['Ловкость рук для дрочки',100],['Защита',45]]
},
{
id:'maxim',
name:'🦾 МАКСИМ — БОРЕЦ',
short:'Мощный защитник.',
desc:'Мощный защитник. Практически не отступает ТОЛЬКО КОГДА ДУШАТ.',
stats:[['Опасность',8],['Сила посасати',150],['Броня',0,'нету'],['Скорость',35]]
},
{
id:'sous',
name:'🧪 СОУС — НЕИЗВЕСТНЫЙ',
short:'Загадочный объект.',
desc:'Загадочный объект. Его способности — жёстко одеваться в леопардовую кофту.',
stats:[['Опасность',9],['Секретность',99],['Интеллект',100],['Хаос',88]]
},
{
id:'nadya',
name:'💎 НАДЯ — КОРОЛЕВА',
short:'Самая шикарная персона архива.',
theme:'nadya',
desc:'Надя — королева архива. Её шикарность не нуждается в доказательствах. Вокруг неё сияют алмазы, а её появление превращает обычный день в королевское событие.',
stats:[['Королевский статус',100],['Шикарность',100],['Красота',100],['Харизма',100],['Блеск',100]]
},
{
id:'olya',
name:'👑 ОЛЯ — ДЕВУШКА МАКСИМА',
short:'Золотая персона архива.',
theme:'olya',
desc:'Оля — девушка Максима. Особенная, милая и харизматичная. У неё золотое сердце, сильный характер и королевская энергия. Максим точно знает, кто здесь главная!',
stats:[['Золотое сердце',100],['Харизма',95],['Доброта',100],['Характер',100],['Влияние на Максима',100]]
}
];

const cards=document.getElementById('cards');

function renderCards(list=characters){
cards.innerHTML='';
if(!list.length){
cards.innerHTML='<p style="color:#a99bbd;text-align:center;grid-column:1/-1">Ничего не найдено</p>';
return;
}
list.forEach(c=>{
const el=document.createElement('article');
el.className='character '+(c.id==='maxim'?'maxim':(c.theme||''));
el.innerHTML=`<h2>${c.name}</h2><p>${c.short}</p><span class="tag">ОТКРЫТЬ ДОСЬЕ</span>`;
el.addEventListener('click',()=>showCharacter(c.id));
cards.appendChild(el);
});
}

function showCharacter(id){
const c=characters.find(x=>x.id===id);
if(!c)return;

const box=document.getElementById('detailBox');
box.classList.remove('detail-maxim','detail-nadya','detail-olya');

if(id==='maxim')box.classList.add('detail-maxim');
if(id==='nadya')box.classList.add('detail-nadya');
if(id==='olya')box.classList.add('detail-olya');

const stats=c.stats.map(([label,value,custom])=>{
const width=Math.max(0,Math.min(100,Number(value)));
return `<div class="stat">
<div class="stat-head"><span>${label}</span><b>${custom||value}</b></div>
<div class="bar"><div class="fill" style="width:${width}%"></div></div>
</div>`;
}).join('');

document.getElementById('detailContent').innerHTML=`
<h2>${c.name}</h2>
<p class="detail-desc">${c.desc}</p>
<h3 style="color:#cba4ee;font-size:13px;letter-spacing:2px">ХАРАКТЕРИСТИКИ</h3>
${stats}`;

document.getElementById('details').style.display='flex';
}

document.getElementById('close').onclick=()=>{
document.getElementById('details').style.display='none';
};

document.getElementById('details').addEventListener('click',e=>{
if(e.target.id==='details')e.currentTarget.style.display='none';
});

document.addEventListener('keydown',e=>{
if(e.key==='Escape')document.getElementById('details').style.display='none';
});

document.getElementById('search').addEventListener('input',e=>{
const q=e.target.value.toLowerCase().trim();
renderCards(characters.filter(c=>(c.name+' '+c.short+' '+c.desc).toLowerCase().includes(q)));
});

renderCards();

/* Перетаскивание состава архива */
const panel=document.getElementById('persons');
const handle=document.getElementById('drag');
let dragging=false,dx=0,dy=0;

handle.addEventListener('pointerdown',e=>{
dragging=true;
const r=panel.getBoundingClientRect();
dx=e.clientX-r.left;
dy=e.clientY-r.top;
handle.setPointerCapture(e.pointerId);
});

handle.addEventListener('pointermove',e=>{
if(!dragging)return;
panel.style.left=Math.max(0,Math.min(innerWidth-panel.offsetWidth,e.clientX-dx))+'px';
panel.style.top=Math.max(0,Math.min(innerHeight-panel.offsetHeight,e.clientY-dy))+'px';
panel.style.right='auto';
});

handle.addEventListener('pointerup',()=>dragging=false);
handle.addEventListener('pointercancel',()=>dragging=false);

/* Звёзды и кометы */
const pc=document.getElementById('particles');
const pctx=pc.getContext('2d');
const cc=document.getElementById('comets');
const cctx=cc.getContext('2d');

let stars=[],comets=[];

function resize(){
pc.width=cc.width=innerWidth;
pc.height=cc.height=innerHeight;

stars=Array.from({length:65},()=>({
x:Math.random()*pc.width,
y:Math.random()*pc.height,
r:Math.random()*1.6+.3,
a:Math.random(),
s:Math.random()*.012+.003
}));

comets=Array.from({length:7},()=>({
x:Math.random()*cc.width,
y:Math.random()*cc.height,
v:Math.random()*3+2,
len:Math.random()*75+45
}));
}

addEventListener('resize',resize);
resize();

function animate(){
pctx.clearRect(0,0,pc.width,pc.height);

stars.forEach(s=>{
s.a+=s.s;
if(s.a>1||s.a<0)s.s*=-1;
pctx.beginPath();
pctx.arc(s.x,s.y,s.r,0,Math.PI*2);
pctx.fillStyle=`rgba(220,195,255,${Math.max(.15,s.a)})`;
pctx.fill();
});

cctx.clearRect(0,0,cc.width,cc.height);

comets.forEach(c=>{
c.x+=c.v;
c.y+=c.v*.35;

const g=cctx.createLinearGradient(
c.x-c.len,c.y-c.len*.35,c.x,c.y
);

g.addColorStop(0,'rgba(70,130,255,0)');
g.addColorStop(1,'rgba(135,190,255,.8)');

cctx.strokeStyle=g;
cctx.lineWidth=2;
cctx.beginPath();
cctx.moveTo(c.x-c.len,c.y-c.len*.35);
cctx.lineTo(c.x,c.y);
cctx.stroke();

if(c.x>cc.width+100||c.y>cc.height+100){
c.x=-Math.random()*300;
c.y=Math.random()*cc.height*.7;
}
});

requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
